appId: com.rocketmeals.web
tags:
  - web
  - smoke
---

# Smoke test: open the app, perform anonymous login, select a canteen,
# and verify the food offers section loads with content

- launchApp:
    clearState: true
    arguments:
      url: ${APP_URL:-"http://localhost:8081/rocket-meals/"}

# Wait for the login screen to load
- waitForAnimationToEnd
- takeScreenshot: app-loaded

# Step 1: Accept the privacy policy (required to enable the login buttons)
- tapOn: "Ich stimme"

# Step 2: Tap "Continue without account" for anonymous login
- tapOn: "Ohne Account fortfahren"

# Step 3: Confirm the attention sheet about anonymous account limitations
- waitForAnimationToEnd
- assertVisible: "Achtung!"
- tapOn: "Bestätigen"

# Step 4: Wait for the canteen selection screen to load
- waitForAnimationToEnd
- takeScreenshot: canteen-selection

# Step 5: Tap on the first available canteen
# CANTEEN_NAME can be overridden via environment variable; defaults to "Mensa"
# which matches most German university canteen aliases as a substring
- tapOn: ${CANTEEN_NAME:-"Mensa"}

# Step 6: Wait for the food offers screen to load
- waitForAnimationToEnd
- takeScreenshot: food-offers

# Step 7: Verify the food offers page loaded with content
# The list always shows "Heute" (today) as the first date header,
# followed by food items or a "no offers / canteen closed" message
- assertVisible: "Heute"
