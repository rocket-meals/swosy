appId: com.rocketmeals.web
tags:
  - web
  - smoke
---

# Simple smoke test: open the web app and verify it loads
- launchApp:
    clearState: true
    arguments:
      url: ${APP_URL:-"http://localhost:8081/rocket-meals/"}

# Wait for the app to be visible (login screen or main screen)
- waitForAnimationToEnd

# Take a screenshot to confirm the app loaded
- takeScreenshot: app-loaded
