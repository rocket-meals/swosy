# SonarCloud configuration for Rocket Meals
sonar.projectKey=rocket-meals_rocket-meals
sonar.organization=rocket-meals

# Combine all exclusions in a single line
# Note: apps/geonexia/frontend/helpers/h3/** is a vendored Emscripten build of Uber's H3 library (not hand-written).
# apps/frontend/app/public/paddleocr/** is the vendored onnxruntime WASM build + PaddleOCR models (and a generated bundle),
# see the README.md in that folder.
# packages/common/src/databaseTypes/{types.ts,CollectionNames.ts} are auto-generated from the Directus schema
# (see AI-AGENT.md in that folder) and must not be hand-edited.
sonar.exclusions=**/dist/**,**/build/**,**/node_modules/**,**/leaflet.html,**/leaflet/index.html,**/leaflet*.js,**/leaflet*.min.js,**/leaflet/**/*.js,**/generate-types/index.js,**/*.min.js,**/coverage/**,**/public/assets/**,**/__tests__/**,**/*.html,apps/geonexia/frontend/helpers/h3/**,apps/frontend/app/public/paddleocr/**,packages/common/src/databaseTypes/types.ts,packages/common/src/databaseTypes/CollectionNames.ts

# Reviewed findings that cannot carry an inline NOSONAR: the Web (HTML in .vue templates) and CSS analyzers
# ignore NOSONAR comments. Each entry is limited to the one rule in the one file; the reason is also written
# next to the code.
sonar.issue.ignore.multicriteria=listRowTabindex,chatComposerClick,statusDotImgRole,networkSvgGroupRole,pushBadgeContrast
# The list row is interactive (click, Enter and Space open it) but cannot be role="button": a button's children
# are presentational, which would hide the nested selection checkbox from screen readers.
sonar.issue.ignore.multicriteria.listRowTabindex.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.listRowTabindex.resourceKey=apps/backend/Backend/directusExtensions/directus-extension-rocket-meals-bundle/src/rocket-meals-module/module-list/list-row.vue
# Click-to-focus on the chat composer box is a mouse-only shortcut: keyboard users focus the textarea directly.
sonar.issue.ignore.multicriteria.chatComposerClick.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.chatComposerClick.resourceKey=apps/backend/Backend/directusExtensions/directus-extension-rocket-meals-bundle/src/rocket-meals-module/support-chat/support-chat-conversation.vue
# The status dot is drawn with CSS incl. a ::after pulse ring that <img>/<svg> cannot render; role="img" +
# aria-label give it the same accessible semantics.
sonar.issue.ignore.multicriteria.statusDotImgRole.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statusDotImgRole.resourceKey=apps/backend/Backend/directusExtensions/directus-extension-rocket-meals-bundle/src/rocket-meals-module/workflows/workflow-status-dot.vue
# The friendship network <svg> drawing has no native group element; role="group" names the container of the
# interactive profile nodes (role="img" would hide those buttons).
sonar.issue.ignore.multicriteria.networkSvgGroupRole.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.networkSvgGroupRole.resourceKey=apps/backend/Backend/directusExtensions/directus-extension-rocket-meals-bundle/src/rocket-meals-module/friendship-network/friendship-network-page.vue
# White on #ff3b30 is deliberately the iOS system badge colour in the home-screen preview of a push notification.
sonar.issue.ignore.multicriteria.pushBadgeContrast.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.pushBadgeContrast.resourceKey=apps/backend/Backend/directusExtensions/directus-extension-rocket-meals-bundle/src/rocket-meals-module/profiles/profile-push-page.vue

# Coverage exclusions
sonar.coverage.exclusions=**/dist/**,**/build/**,**/node_modules/**,**/leaflet.html,**/leaflet/index.html,**/leaflet*.js,**/leaflet*.min.js,**/leaflet/**/*.js,**/generate-types/index.js,**/*.min.js,**/coverage/**,**/__tests__/**,**/*spec*/**,apps/frontend/app/**,apps/geonexia/frontend/helpers/h3/**,packages/common/src/databaseTypes/types.ts,packages/common/src/databaseTypes/CollectionNames.ts

# Source directories
sonar.sources=.
sonar.sourceEncoding=UTF-8
