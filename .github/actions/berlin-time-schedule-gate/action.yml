name: 'Berlin Time Schedule Gate'
description: >-
  GitHub cron schedules run in UTC and ignore daylight saving time. To hit a
  fixed local time in Germany all year round, a workflow schedules the same
  local time twice (once for CEST, once for CET) and lets this gate decide
  which of the two runs is the real one. Non-schedule events always pass.

inputs:
  cron-summer:
    description: 'The cron expression (exactly as written in `on.schedule`) that matches the local time during CEST (UTC+2)'
    required: true
  cron-winter:
    description: 'The cron expression (exactly as written in `on.schedule`) that matches the local time during CET (UTC+1)'
    required: true

outputs:
  run:
    description: "'true' if the workflow should continue, 'false' if this scheduled run is the off-season duplicate"
    value: ${{ steps.gate.outputs.run }}

runs:
  using: 'composite'
  steps:
    - name: "🕰️ Check Berlin time offset"
      id: gate
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        # The cron string that fired this run. Comparing it (instead of the
        # current hour) keeps the gate correct even when GitHub starts a
        # scheduled run late, which is common at the top of the hour.
        FIRED_SCHEDULE: ${{ github.event.schedule }}
        CRON_SUMMER: ${{ inputs.cron-summer }}
        CRON_WINTER: ${{ inputs.cron-winter }}
      run: |
        if [ "$EVENT_NAME" != "schedule" ]; then
          echo "ℹ️ Triggered by '$EVENT_NAME' - no schedule gate."
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        OFFSET="$(TZ=Europe/Berlin date +%z)"
        if [ "$OFFSET" = "+0200" ]; then
          EXPECTED="$CRON_SUMMER"
        else
          EXPECTED="$CRON_WINTER"
        fi

        echo "Berlin offset: $OFFSET, fired schedule: '$FIRED_SCHEDULE', expected: '$EXPECTED'"
        if [ "$FIRED_SCHEDULE" = "$EXPECTED" ]; then
          echo "✅ This is the scheduled run for the current Berlin time."
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "⏭️ Off-season duplicate of the schedule - skipping."
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi
