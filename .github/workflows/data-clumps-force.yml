name: "🩺 Data Clumps Force Analysis"

on:
  workflow_dispatch:
    inputs:
      start-directory:
        description: "Start directory for the analysis"
        required: false
        default: "."
      amount:
        description: "Number of top data clumps to list in the issue body"
        required: false
        default: "5"

jobs:
  data-clumps-force:
    name: "🩺 Analyse Data Clumps (Force)"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🗑️ Remove existing data clumps report"
        run: rm -f reports/data-clumps-doctor/data-clumps.json
      - name: "🩺 Analyse data clumps"
        id: data-clumps
        uses: NilsBaumgartner1994/data-clumps-doctor/.github/actions/analyse-data-clumps@master
        with:
          path-to-source: ${{ github.event.inputs.start-directory || '.' }}
          output-path: reports/data-clumps-doctor/data-clumps.json
          badge-output-path: reports/data-clumps-doctor/badges/data-clumps.svg
          source-language-type: typescript
          generate-issue: 'true'
          only-update-if-changes: 'false'
          refactor-amount: ${{ github.event.inputs.amount || '5' }}
          detector-options-paths-ignored-in-detection-comparison: '**/databaseTypes/types.ts'
      - name: "💾 Stage reports"
        uses: ./.github/actions/stage-changes
        with:
          name: data-clumps
          paths: |
            reports/data-clumps-doctor/data-clumps.json
            reports/data-clumps-doctor/badges/data-clumps.svg
          description: "update data-clumps reports"

  # Single writer to the branch. This used to be a `git push --force`, which
  # could silently drop commits other jobs had pushed in the meantime.
  publish-staged-changes:
    name: "📤 Publish Staged Changes"
    runs-on: ubuntu-latest
    needs: [data-clumps-force]
    if: always()
    permissions:
      contents: write
      actions: read
    steps:
      # fetch-depth: 0 is required - `git apply --3way` needs the blobs the
      # staged patches were built against.
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "📤 Apply and push all staged changes"
        uses: ./.github/actions/publish-staged-changes
        with:
          branch: ${{ github.ref_name }}
          commit-message: "chore: update data-clumps reports [skip ci]"
