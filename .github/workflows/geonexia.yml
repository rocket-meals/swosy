name: "🌍 Geonexia CI"

on:
  push:
    branches: [main, master, dev]
    paths:
      - "apps/geonexia/frontend/**"
      - "packages/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-repository:
    name: "🔍 Check Repository"
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      is-upstream: ${{ steps.check.outputs.is-upstream }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
      - name: "🔍 Check Repository Type"
        id: check
        uses: ./.github/actions/check-repository

  expo-update:
    name: "🚀 EAS Update (OTA)"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: "⚙️ Enable Corepack"
        run: corepack enable
      - name: "📦 Get Yarn cache directory path"
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - name: "📦 Cache Yarn dependencies"
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: "⚙️ Setup EAS CLI"
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: "📦 Install dependencies"
        run: yarn install --immutable
      - name: "🚀 Publish OTA update"
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            CHANNEL="production"
          else
            CHANNEL="preview"
          fi
          eas update --auto --platform all --non-interactive --channel "$CHANNEL"
        working-directory: ./apps/geonexia/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-android-preview:
    name: "🧪 Build Android Preview APK"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: "⚙️ Enable Corepack"
        run: corepack enable
      - name: "📦 Get Yarn cache directory path"
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - name: "📦 Cache Yarn dependencies"
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: "⚙️ Setup EAS CLI"
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: "📦 Install dependencies"
        run: yarn install --immutable
      - name: "🧪 Build preview APK"
        run: eas build --platform android --non-interactive --profile preview
        working-directory: ./apps/geonexia/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
