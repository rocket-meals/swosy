name: "🧪 Test: Android Preview APK Action"

on:
  workflow_dispatch:
    inputs:
      app_key:
        description: 'README marker key for the app'
        required: false
        default: 'frontend'
      app_label:
        description: 'Display name shown next to the APK link'
        required: false
        default: 'Rocket Meals (Frontend)'
      working_directory:
        description: 'Directory of the Expo app to build'
        required: false
        default: './apps/frontend/app'
      update_readme:
        description: 'Also write the link into README.md and push it to this branch'
        required: false
        type: boolean
        default: false

jobs:
  test-build-android-preview-apk:
    name: "🧪 Test Build Android Preview APK"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "🧪 Build Android Preview APK & update README"
        id: build
        uses: ./.github/actions/build-android-preview-apk
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ${{ github.event.inputs.working_directory }}
          app-key: ${{ github.event.inputs.app_key }}
          app-label: ${{ github.event.inputs.app_label }}
          update-readme: ${{ github.event.inputs.update_readme }}

      - name: "📤 Upload raw EAS build JSON"
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-output
          path: ${{ github.event.inputs.working_directory }}/eas-build-output.json
          retention-days: 7

      - name: "🖨️ Print result"
        run: |
          echo "APK URL: ${{ steps.build.outputs.apk-url }}"

      - name: "💾 Stage README update"
        if: github.event.inputs.update_readme == 'true'
        uses: ./.github/actions/stage-changes
        with:
          name: readme-android-preview-test
          paths: README.md
          description: "test Android preview APK link in README"

  # Single writer to the branch: the job above only uploads its README change as
  # a patch artifact, this job applies it and pushes it with a rebase-retry.
  publish-staged-changes:
    name: "📤 Publish Staged Changes"
    runs-on: ubuntu-latest
    needs: [test-build-android-preview-apk]
    if: always() && github.event.inputs.update_readme == 'true'
    permissions:
      contents: write
      actions: read
    steps:
      # fetch-depth: 0 is required - `git apply --3way` needs the blobs the
      # staged patches were built against.
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "📤 Apply and push all staged changes"
        uses: ./.github/actions/publish-staged-changes
        with:
          branch: ${{ github.ref_name }}
          commit-message: "chore: test Android preview APK link in README [skip ci]"
