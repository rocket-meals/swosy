name: "🗄️ Backend Schema Sync Pull (Manual)"

# Pulls the current database schema (directus-sync data + generated types) from the
# test system and commits the changes to the branch the workflow was started on.
#
# Required repository secrets:
#   - ADMIN_EMAIL:    Admin email of the test system Directus instance
#   - ADMIN_PASSWORD: Admin password of the test system Directus instance

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for the schema changes'
        required: false
        type: string
        default: 'chore: pull database schema from test system [skip ci]'

jobs:
  sync:
    name: "🗄️ Pull schema from test system"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: "⚙️ Enable Corepack for Yarn"
        run: corepack enable

      - name: "📦 Get Yarn cache directory path"
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: "📦 Cache Yarn dependencies"
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: "📦 Install dependencies"
        run: yarn install --immutable --mode=skip-build

      - name: "🎭 Install Playwright browser (for type download)"
        # NOSONAR - "Lifecycle scripts are enabled by default in Yarn v2+": this is not a
        # `yarn install` of project dependencies (that one already runs with
        # `--mode=skip-build` above), it is Playwright's own browser downloader invoked via
        # `yarn workspace ... exec`. There is no dependency lifecycle script to skip here,
        # so the finding is suppressed instead of "fixed". See "Umgang mit
        # SonarCloud-Findings" in the README.
        run: yarn workspace backend-sync exec playwright install --with-deps chromium # NOSONAR

      - name: "🗄️ Pull database schema from test system"
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::Secrets ADMIN_EMAIL and ADMIN_PASSWORD must be configured for this workflow."
            exit 1
          fi
          yarn workspace backend-sync sync:pull-from-test-system

      - name: "💾 Stage schema changes"
        uses: ./.github/actions/stage-changes
        with:
          name: backend-schema
          paths: |
            data/directus-sync-data
            packages/common/src/databaseTypes
          description: "pull database schema from test system"

  # Single writer to the branch: the job above only uploads its changes as a
  # patch artifact, this job applies it and pushes it with a rebase-retry.
  publish-staged-changes:
    name: "📤 Publish Staged Changes"
    runs-on: ubuntu-latest
    needs: [sync]
    if: always()
    permissions:
      contents: write
      actions: read
    steps:
      # fetch-depth: 0 is required - `git apply --3way` needs the blobs the
      # staged patches were built against.
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "📤 Apply and push all staged changes"
        uses: ./.github/actions/publish-staged-changes
        with:
          branch: ${{ github.ref_name }}
          commit-message: "${{ github.event.inputs.commit_message || 'chore: pull database schema from test system [skip ci]' }}"
