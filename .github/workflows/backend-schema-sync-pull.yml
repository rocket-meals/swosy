name: "🗄️ Backend Schema Sync Pull (Manual)"

# Pulls the current database schema (directus-sync data + generated types) from the
# test system and commits the changes to the branch the workflow was started on.
#
# Required repository secrets:
#   - ADMIN_EMAIL:    Admin email of the test system Directus instance
#   - ADMIN_PASSWORD: Admin password of the test system Directus instance

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for the schema changes'
        required: false
        type: string
        default: 'chore: pull database schema from test system [skip ci]'

jobs:
  sync:
    name: "🗄️ Pull schema from test system"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # TEMPORARY diagnostic step (will be reverted): inspect duplicate foodoffers via public API
      - name: "🔎 Diagnose foodoffers duplicates"
        run: |
          API="https://test.rocket-meals.de/rocket-meals/api"
          echo "=== newest 15 foodoffers ==="
          curl -sS "$API/items/foodoffers?limit=15&sort=-date_created&fields=id,alias,date,result_hash,is_component,canteen,food,status,date_created,translations.id,translations.name,translations.languages_code" | head -c 6000
          echo
          echo "=== foodoffers with alias null (the 'empty' ones), newest 15 ==="
          curl -sS "$API/items/foodoffers?limit=15&sort=-date_created&filter%5Balias%5D%5B_null%5D=true&fields=id,alias,date,result_hash,is_component,canteen,food,status,date_created,date_updated,translations.id,translations.name,translations.languages_code" | head -c 6000
          echo
          echo "=== count alias-null vs total ==="
          curl -sS "$API/items/foodoffers?aggregate%5Bcount%5D=id&filter%5Balias%5D%5B_null%5D=true" | head -c 500
          echo
          curl -sS "$API/items/foodoffers?aggregate%5Bcount%5D=id" | head -c 500
          echo
          echo "=== one empty foodoffer in detail (all public fields) ==="
          EMPTY_ID=$(curl -sS "$API/items/foodoffers?limit=1&sort=-date_created&filter%5Balias%5D%5B_null%5D=true&fields=id" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          echo "empty id: $EMPTY_ID"
          if [ -n "$EMPTY_ID" ]; then
            curl -sS "$API/items/foodoffers/$EMPTY_ID?fields=*,translations.*,markings.*,foodoffer_components.*,attribute_values.*" | head -c 4000
          fi
          echo
          echo "=== foodoffers_translations count ==="
          curl -sS "$API/items/foodoffers_translations?aggregate%5Bcount%5D=id" | head -c 300

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: "⚙️ Enable Corepack for Yarn"
        run: corepack enable

      - name: "📦 Get Yarn cache directory path"
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: "📦 Cache Yarn dependencies"
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: "📦 Install dependencies"
        run: yarn install --immutable

      - name: "🎭 Install Playwright browser (for type download)"
        run: yarn workspace backend-sync exec playwright install --with-deps chromium

      - name: "🗄️ Pull database schema from test system"
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::Secrets ADMIN_EMAIL and ADMIN_PASSWORD must be configured for this workflow."
            exit 1
          fi
          yarn workspace backend-sync sync:pull-from-test-system

      - name: "🤖 Configure Git"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "📤 Commit and push schema changes"
        run: |
          git add data/directus-sync-data packages/common/src/databaseTypes
          if git diff --cached --quiet; then
            echo "ℹ️ No schema changes detected, nothing to commit."
          else
            git commit -m "${{ github.event.inputs.commit_message || 'chore: pull database schema from test system [skip ci]' }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
