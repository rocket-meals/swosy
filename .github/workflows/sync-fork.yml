name: 🔄 Fork Synchronization

permissions:
  contents: write

on:
  # Run hourly
  schedule:
    - cron: '0 0 * * *'  # Runs at 00:00. 

  # Allow manual triggering
  workflow_dispatch:

jobs:
  sync-fork:
    name: 🔄 Sync Fork with Upstream
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check Repository Type
        id: check-repo
        uses: ./.github/actions/check-repository

      - name: 🔍 Check for Updates from Upstream
        id: check-updates
        if: steps.check-repo.outputs.is-fork == 'true'
        run: |
          # Fetch upstream repository
          git remote add upstream https://github.com/rocket-meals/rocket-meals.git || true
          git fetch upstream master
          
          # Check if there are differences
          LOCAL_COMMIT=$(git rev-parse HEAD)
          UPSTREAM_COMMIT=$(git rev-parse upstream/master)
          
          echo "Local commit: $LOCAL_COMMIT"
          echo "Upstream commit: $UPSTREAM_COMMIT"
          
          if [ "$LOCAL_COMMIT" != "$UPSTREAM_COMMIT" ]; then
            echo "Updates available from upstream"
            echo "has-updates=true" >> $GITHUB_OUTPUT
          else
            echo "No updates available"
            echo "has-updates=false" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Extract Pre-Sync Build Numbers
        id: build-numbers
        if: steps.check-repo.outputs.is-fork == 'true' && steps.check-updates.outputs.has-updates == 'true'
        run: |
          extract_build_number() {
            local config_file="$1"
            if [ -f "$config_file" ]; then
              grep -A 5 'function getBuildNumber' "$config_file" | grep 'return' | grep -Eo '[0-9]+' | head -1 || echo "not-found"
            else
              echo "⚠️ Config file not found: $config_file" >&2
              echo "not-found"
            fi
          }

          frontend=$(extract_build_number "apps/frontend/app/config.ts")
          geonexia=$(extract_build_number "apps/geonexia/frontend/config.ts")
          score_tracker=$(extract_build_number "apps/score-tracker/frontend/config.ts")

          echo "📦 Pre-sync build numbers:"
          echo "  Frontend: $frontend"
          echo "  Geonexia: $geonexia"
          echo "  Score Tracker: $score_tracker"

          echo "frontend=$frontend" >> $GITHUB_OUTPUT
          echo "geonexia=$geonexia" >> $GITHUB_OUTPUT
          echo "score_tracker=$score_tracker" >> $GITHUB_OUTPUT
        shell: bash

      - name: 🔄 Sync Fork with Upstream
        id: sync-result
        if: steps.check-repo.outputs.is-fork == 'true' && steps.check-updates.outputs.has-updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
        run: |
          REPO_FULL_NAME="${{ steps.check-repo.outputs.repository-name }}"
          echo "Syncing fork: $REPO_FULL_NAME"
          echo "Upstream repository: rocket-meals/rocket-meals"
          echo "Target branch: master"

          # Sync the fork with the upstream repository without overwriting local commits.
          # Forks intentionally diverge for tenant-specific settings (e.g. getCustomerConfig()).
          if gh repo sync "$REPO_FULL_NAME" -b master; then
            echo "✅ Fork synchronization completed successfully!"
            echo "sync-success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Fork synchronization failed!"
            echo "sync-success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 🚀 Trigger Combined CI
        if: steps.check-repo.outputs.is-fork == 'true' && steps.sync-result.outputs.sync-success == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
        run: |
          echo "🚀 Triggering Combined CI workflow after successful sync..."
          gh workflow run ci.yml \
            --repo "${{ steps.check-repo.outputs.repository-name }}" \
            --ref master \
            -f previous_build_number_frontend="${{ steps.build-numbers.outputs.frontend }}" \
            -f previous_build_number_geonexia="${{ steps.build-numbers.outputs.geonexia }}" \
            -f previous_build_number_score_tracker="${{ steps.build-numbers.outputs.score_tracker }}"
          echo "✅ Combined CI workflow triggered!"

      - name: ⏭️ Skip Fork Sync - No Updates
        if: steps.check-repo.outputs.is-fork == 'true' && steps.check-updates.outputs.has-updates == 'false'
        run: |
          echo "⏭️ No updates available from upstream - skipping sync."

      - name: ⏭️ Skip Fork Sync - Upstream Repository
        if: steps.check-repo.outputs.is-fork == 'false'
        run: |
          echo "⏭️ Skipping fork synchronization - this is the upstream repository."
